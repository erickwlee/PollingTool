<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport settings prevent pinch-to-zoom and ensure 1:1 mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Audience Polling</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Modern dynamic viewport height for mobile browsers */
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      background-color: #000;
    }

    /* 2x2 Grid View */
    #grid-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
    }

    .quadrant {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      font-weight: 800;
      font-size: clamp(3rem, 15vw, 6rem);
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .quadrant:active {
      filter: brightness(0.85);
      transform: scale(0.98);
    }

    /* Current Colors: A=Red, B=Yellow, C=Purple, D=Blue */
    .color-a { background-color: #E53935; color: #FFFFFF; } /* Red */
    .color-b { background-color: #FDD835; color: #1A1A1A; } /* Yellow (dark text for contrast) */
    .color-c { background-color: #8E24AA; color: #FFFFFF; } /* Purple */
    .color-d { background-color: #1E88E5; color: #FFFFFF; } /* Blue */

    /* Fullscreen Response View */
    #vote-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    #vote-view.active {
      display: flex;
    }

    #vote-letter {
      font-size: clamp(8rem, 40vw, 20rem);
      font-weight: 900;
      line-height: 1;
    }

    #vote-tip {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.7;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Selection Grid -->
  <main id="grid-view">
    <button class="quadrant color-a" data-choice="A" data-bg="#E53935" data-fg="#FFFFFF">A</button>
    <button class="quadrant color-b" data-choice="B" data-bg="#FDD835" data-fg="#1A1A1A">B</button>
    <button class="quadrant color-c" data-choice="C" data-bg="#8E24AA" data-fg="#FFFFFF">C</button>
    <button class="quadrant color-d" data-choice="D" data-bg="#1E88E5" data-fg="#FFFFFF">D</button>
  </main>

  <!-- Screen 2: Fullscreen Display -->
  <section id="vote-view" role="button" aria-label="Selected vote. Tap to return.">
    <span id="vote-letter"></span>
    <span id="vote-tip">Tap anywhere to change vote</span>
  </section>

  <script>
    const gridView = document.getElementById('grid-view');
    const voteView = document.getElementById('vote-view');
    const voteLetter = document.getElementById('vote-letter');
    const voteTip = document.getElementById('vote-tip');

    // Keep screen awake if supported
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          // Wake Lock can fail silently if battery is extremely low
        }
      }
    }

    // Handle Option Selection
    document.querySelectorAll('.quadrant').forEach(button => {
      button.addEventListener('click', () => {
        const choice = button.getAttribute('data-choice');
        const bg = button.getAttribute('data-bg');
        const fg = button.getAttribute('data-fg');

        voteView.style.backgroundColor = bg;
        voteLetter.textContent = choice;
        voteLetter.style.color = fg;
        voteTip.style.color = fg;

        gridView.style.display = 'none';
        voteView.classList.add('active');

        requestWakeLock();
      });
    });

    // Tap anywhere to return to the selection grid
    voteView.addEventListener('click', () => {
      voteView.classList.remove('active');
      gridView.style.display = 'grid';
    });

    // Re-acquire screen wake lock if user tabs out and comes back
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
